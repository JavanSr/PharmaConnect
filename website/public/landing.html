<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --pc-50:#EDF7F3; --pc-100:#D6F0E8; --pc-200:#AFDFD3;
  --pc-500:#2A9478; --pc-600:#1A6B5C; --pc-700:#145748;
  --pc-800:#0D4035; --pc-900:#082B23;
  --paper:#F7FBF8; --ink:#0D4035; --muted:#516965;
  --amber:#E8913A; --amber-soft:#F6C58A; --line:#E2EDE8;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;line-height:1.6}
.serif{font-family:'DM Serif Display',Georgia,serif}
.mono{font-family:'JetBrains Mono',Menlo,monospace}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.grid-bg{background-image:radial-gradient(rgba(13,64,53,0.08) 1px,transparent 1px);background-size:22px 22px}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.marquee-track{animation:marquee 38s linear infinite}
@keyframes livepulse{0%,100%{box-shadow:0 0 0 0 rgba(42,148,120,0.55)}50%{box-shadow:0 0 0 7px rgba(42,148,120,0)}}
.live-dot{animation:livepulse 1.8s ease-out infinite}
.reveal{opacity:0;transform:translateY(14px);transition:opacity 700ms ease,transform 700ms ease}
.reveal.in{opacity:1;transform:none}
.tape{background:linear-gradient(180deg,var(--amber-soft),#f0b272);color:#5a330d;font-weight:600}
.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}
.tab-btn{padding:10px 18px;font-size:13px;font-weight:500;border-bottom:2px solid transparent;
  color:var(--muted);cursor:pointer;transition:all 150ms;background:none;
  border-top:none;border-left:none;border-right:none;font-family:'DM Sans',system-ui,sans-serif}
.tab-btn:hover{color:var(--ink)}
.tab-btn.active{color:var(--pc-600);border-bottom-color:var(--pc-600)}
.billing-btn{padding:8px 20px;border-radius:999px;font-size:13px;font-weight:500;
  transition:all 150ms;cursor:pointer;font-family:inherit;background:none;border:none;color:var(--muted)}
.billing-btn.active{background:var(--pc-600);color:white}
.faq-item{border-bottom:1px solid var(--line)}
.faq-btn{width:100%;display:flex;justify-content:space-between;align-items:center;
  gap:16px;padding:20px 0;text-align:left;cursor:pointer;background:none;border:none;
  font-family:'DM Sans',system-ui,sans-serif;font-size:15px;font-weight:500;color:var(--ink)}
input,select{font-family:'DM Sans',system-ui,sans-serif;outline:none;transition:border-color 150ms}
input:focus,select:focus{border-color:var(--pc-600) !important}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
@keyframes drawLine{from{stroke-dashoffset:440}to{stroke-dashoffset:0}}
@keyframes fadeArea{from{opacity:0}to{opacity:1}}
.chart-line{stroke-dasharray:440;stroke-dashoffset:440;animation:drawLine 2.8s cubic-bezier(0.4,0,0.2,1) forwards 0.5s}
.chart-area{opacity:0;animation:fadeArea 2.5s ease forwards 1.1s}
.card-stagger{opacity:0}
.reveal.in .card-stagger{animation:fadeUp 560ms ease both}
.reveal.in .card-stagger:nth-child(1){animation-delay:0ms}
.reveal.in .card-stagger:nth-child(2){animation-delay:65ms}
.reveal.in .card-stagger:nth-child(3){animation-delay:130ms}
.reveal.in .card-stagger:nth-child(4){animation-delay:195ms}
.reveal.in .card-stagger:nth-child(5){animation-delay:260ms}
.reveal.in .card-stagger:nth-child(6){animation-delay:325ms}
.reveal.in .card-stagger:nth-child(7){animation-delay:390ms}
.reveal.in .card-stagger:nth-child(8){animation-delay:455ms}
.reveal.in .card-stagger:nth-child(9){animation-delay:520ms}
.reveal.in .card-stagger:nth-child(10){animation-delay:585ms}
.reveal.in .card-stagger:nth-child(11){animation-delay:650ms}
.reveal.in .card-stagger:nth-child(12){animation-delay:715ms}
</style>

// ── APP ───────────────────────────────────────────────────────────────────────

function App() {
  useEffect(()=>{
    const els = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver(entries=>{
      entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in'); });
    },{threshold:0.1});
    els.forEach(el=>io.observe(el));
    return ()=>io.disconnect();
  },[]);
  return (
    <div>
      <Nav/>
      <Hero/>
      <Marquee/>
      <HowItWorks/>
      <FeatureTabs/>
      <DashboardScreens/>
      <CallatTheTill/>
      <EverythingIncluded/>
      <SafetyChecks/>
      <RoleSection/>
      <PricingSection/>
      <FAQ/>
      <FinalCTA/>
      <Footer/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
