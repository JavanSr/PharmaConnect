<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="20" fill="#1A6B5C"/>

  <!-- Vertical arm -->
  <rect x="43.3" y="6.7" width="13.3" height="86.6" rx="1.7" fill="white"/>
  <!-- Horizontal arm -->
  <rect x="6.7" y="43.3" width="86.6" height="13.3" rx="1.7" fill="white"/>

  <!-- Tip nodes — diameter = arm width (13.3px), radius = 6.7px -->
  <circle cx="50" cy="13.3"  r="6.7" fill="white"/>
  <circle cx="50" cy="86.7"  r="6.7" fill="white"/>
  <circle cx="13.3" cy="50"  r="6.7" fill="white"/>
  <circle cx="86.7" cy="50"  r="6.7" fill="white"/>

  <!-- Centre hub — hollow, ring shows "junction" concept -->
  <circle cx="50" cy="50" r="9.2" fill="#1A6B5C" stroke="rgba(255,255,255,0.35)" stroke-width="2.1"/>
</svg>
