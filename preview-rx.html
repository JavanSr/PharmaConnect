<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; background: #f0f0f0; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); display: flex; gap: 40px; align-items: center; }
    .label { text-align: center; font-family: sans-serif; color: #666; margin-top: 8px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <div>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="150" height="195">
        <ellipse cx="100" cy="72" rx="36" ry="46" fill="none" stroke="#1A6B5C" stroke-width="14" stroke-linecap="round"/>
        <line x1="100" y1="118" x2="100" y2="240" stroke="#1A6B5C" stroke-width="14" stroke-linecap="round"/>
        <line x1="44" y1="152" x2="156" y2="152" stroke="#1A6B5C" stroke-width="14" stroke-linecap="round"/>
      </svg>
      <div class="label">pc-600 teal</div>
    </div>
    <div>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="150" height="195">
        <ellipse cx="100" cy="72" rx="36" ry="46" fill="none" stroke="#2A9478" stroke-width="14" stroke-linecap="round"/>
        <line x1="100" y1="118" x2="100" y2="240" stroke="#2A9478" stroke-width="14" stroke-linecap="round"/>
        <line x1="44" y1="152" x2="156" y2="152" stroke="#2A9478" stroke-width="14" stroke-linecap="round"/>
      </svg>
      <div class="label">pc-500 mid teal</div>
    </div>
    <div style="background:#0D4035; padding: 20px; border-radius: 12px;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="150" height="195">
        <ellipse cx="100" cy="72" rx="36" ry="46" fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>
        <line x1="100" y1="118" x2="100" y2="240" stroke="white" stroke-width="14" stroke-linecap="round"/>
        <line x1="44" y1="152" x2="156" y2="152" stroke="white" stroke-width="14" stroke-linecap="round"/>
      </svg>
      <div class="label" style="color:#aaa;">white on dark</div>
    </div>
  </div>
</body>
</html>
