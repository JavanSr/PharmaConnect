version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pharmaconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pharmaconnect
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pharmaconnect
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - ./backend/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pharmaconnect -d pharmaconnect']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: pharmaconnect-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - ./backend/redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  default:
    name: pharmaconnect-network
    driver: bridge
